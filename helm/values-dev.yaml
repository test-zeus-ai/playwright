service-template:
  fullnameOverride: "testzeus-traceviewer"
  replicaCount: 1

  serviceAccount:
    create: true
    name: "testzeus-traceviewer-sa"
    automount: false  # nginx does not call the K8s API

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: trace-viewer
      image:
        repository: "us-central1-docker.pkg.dev/GCP_PROJECT_ID_DEV/GAR_DOCKER_REPOSITORY_DEV"
        tag: latest
        pullPolicy: Always
      ports:
        - containerPort: 80
      env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "80"
        - name: NODE_ENV
          value: development
      resources:
        requests:
          cpu: "25m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 20
        failureThreshold: 3
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 101  # nginx user
        runAsGroup: 101
        capabilities:
          drop:
            - ALL

  service:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 80

  httpRoute:
    enabled: true
    parentRefs:
      - name: main-gateway
        namespace: gateway-infra
        sectionName: http
    hostnames:
      - "tzviewer.dev.testzeus.app"
    rules:
      - matches:
          - path:
              value: /
              type: PathPrefix

  secrets:
    enabled: false # No secrets for trace-viewer yet
