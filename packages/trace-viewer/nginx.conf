server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Quiet favicon requests instead of 404 noise
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Block access to dotfiles
    location ~ /\.(?!well-known)(.*)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Quiet common scanner/dev-only paths
    location ~* ^/(?:@vite|actutor|actuator|\.env|\.git|\.vscode) {
        return 404;
        access_log off;
        log_not_found off;
    }

    # Static files and SPA fallback for known entry points
    location / {
        try_files $uri $uri/ /index.html;
    }
}


