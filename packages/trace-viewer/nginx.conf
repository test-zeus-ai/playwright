server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Quiet favicon requests instead of 404 noise
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Block access to dotfiles
    location ~ /\.(?!well-known)(.*)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Quiet common scanner/dev-only paths
    location ~* ^/(?:@vite|actutor|actuator|\.env|\.git|\.vscode) {
        return 404;
        access_log off;
        log_not_found off;
    }

    # The service worker and the pages that register it must not be cached by the CDN or
    # browser: a stale worker refuses traces from a newer Playwright.
    location ~* ^/(?:sw\.bundle\.js|index\.html|uiMode\.html|snapshot\.html)?$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Static files and SPA fallback for known entry points
    location / {
        try_files $uri $uri/ /index.html;
    }
}
